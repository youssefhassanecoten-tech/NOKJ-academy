      let currentLang = localStorage.getItem('nokj-language') || 'en';
      const originalTextMap = new WeakMap();

      function applyTranslation(lang) {
        const walker = document.createTreeWalker(
          document.body,
          NodeFilter.SHOW_TEXT, {
            acceptNode: function(node) {
              const parent = node.parentElement;
              if (!parent) return NodeFilter.FILTER_REJECT;
              const tag = parent.tagName;
              if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
              if (node.nodeValue.trim() === '') return NodeFilter.FILTER_REJECT;
              return NodeFilter.FILTER_ACCEPT;
            }
          }
        );

        let nodes = [];
        let node;
        while (node = walker.nextNode()) {
          nodes.push(node);
        }

        nodes.forEach(function(textNode) {
          if (!originalTextMap.has(textNode)) {
            originalTextMap.set(textNode, textNode.nodeValue);
          }
          const original = originalTextMap.get(textNode);
          const trimmed = original.trim();
          if (lang === 'ru' && translations[trimmed] !== undefined) {
            textNode.nodeValue = original.replace(trimmed, translations[trimmed]);
          } else if (lang === 'en') {
            textNode.nodeValue = original;
          }
        });

        document.querySelectorAll('[placeholder]').forEach(function(el) {
          const placeholder = el.placeholder;
          if (lang === 'ru' && translations[placeholder] !== undefined) {
            el.placeholder = translations[placeholder];
          }
        });
      }

      function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('nokj-language', lang);

        const ukFlags = document.querySelectorAll('#flag-uk, #login-flag-uk, #register-flag-uk');
        const ruFlags = document.querySelectorAll('#flag-ru, #login-flag-ru, #register-flag-ru');

        if (lang === 'en') {
          ukFlags.forEach(el => el.style.display = 'block');
          ruFlags.forEach(el => el.style.display = 'none');
        } else {
          ukFlags.forEach(el => el.style.display = 'none');
          ruFlags.forEach(el => el.style.display = 'block');
        }

        applyTranslation(lang);
        document.documentElement.lang = lang;
      }

      function toggleLanguage() {
        setLanguage(currentLang === 'en' ? 'ru' : 'en');
      }

        if (savedTeachers) { try { teachers = JSON.parse(savedTeachers); } catch (e) { teachers = DEFAULT_TEACHERS.slice(); } } else { teachers =

        if (savedAdmins) { try { admins = JSON.parse(savedAdmins); } catch (e) { admins = DEFAULT_ADMINS.slice(); } } else { admins =

        if (savedCourses) { try { courses = JSON.parse(savedCourses); } catch (e) { courses = DEFAULT_COURSES.slice(); } } else { courses =
            DEFAULT_COURSES.slice(); }
        if (savedEnrollments) { try { enrollments = JSON.parse(savedEnrollments); } catch (e) { enrollments = DEFAULT_ENROLLMENTS.slice(); } } else { enrollments =
            DEFAULT_ENROLLMENTS.slice(); }
        if (savedMeetings) { try { meetings = JSON.parse(savedMeetings); } catch (e) { meetings = DEFAULT_MEETINGS.slice(); } } else { meetings =
            DEFAULT_MEETINGS.slice(); }
        if (savedGrades) { try { gradeData = JSON.parse(savedGrades); } catch (e) { gradeData = DEFAULT_GRADES; } } else { gradeData =
            DEFAULT_GRADES; }
        if (savedTasks) { try { tasks = JSON.parse(savedTasks); } catch (e) { tasks = DEFAULT_TASKS.slice(); } } else { tasks =
            DEFAULT_TASKS.slice(); }
        if (savedSubmissions) { try { taskSubmissions = JSON.parse(savedSubmissions); } catch (e) { taskSubmissions =
              DEFAULT_TASK_SUBMISSIONS; } } else { taskSubmissions = DEFAULT_TASK_SUBMISSIONS; }
        if (savedBudget) { try { budgetEntries = JSON.parse(savedBudget); } catch (e) { budgetEntries = DEFAULT_BUDGET.slice(); } } else { budgetEntries =
            DEFAULT_BUDGET.slice(); }
        if (savedTests) { try { tests = JSON.parse(savedTests); } catch (e) { tests = []; } } else { tests = []; }
        if (savedTestSubmissions) { try { testSubmissions = JSON.parse(savedTestSubmissions); } catch (e) { testSubmissions =
              {}; } } else { testSubmissions = {}; }
      }

      function getTeacherName(id) {
        var t = teachers.find(function(tc) { return tc.id === id; });
        return t ? t.name : 'Unknown';
      }

      function getStudentName(id) {
        var s = students.find(function(st) { return st.id === id; });
        return s ? s.name : 'Unknown';
      }

      function getCourseName(id) {
        var c = courses.find(function(co) { return co.id === id; });
        return c ? c.name : 'Unknown';
      }

      function getEnrolledCourseIds(studentId) {
        return enrollments.filter(function(e) { return e.studentId === studentId; }).map(function(e) { return e.courseId; });
      }

      function getEnrolledStudentIds(courseId) {
        return enrollments.filter(function(e) { return e.courseId === courseId; }).map(function(e) { return e.studentId; });
      }

      function getCourseStudentCount(courseId) {
        return enrollments.filter(function(e) { return e.courseId === courseId; }).length;
      }

      function getUserByEmail(email) {
        var user = students.find(function(s) { return s.email === email; });
        if (user) return user;
        user = teachers.find(function(t) { return t.email === email; });
        if (user) return user;
        user = admins.find(function(a) { return a.email === email; });
        return user || null;
      }

      function getAllUsers() {
        return [].concat(students, teachers, admins);
      }

      function generateId() {
        var maxId = 1;
        getAllUsers().forEach(function(u) {
          if (u.id > maxId) maxId = u.id;
        });
        return maxId + 1;
      }

        if (pageName === 'calendar') renderCalendar();
        if (pageName === 'classroom') renderMeetings();
        if (pageName === 'tests') renderTests();
        setLanguage(currentLang);
      }

      // ============================================================
      //  LOGIN / REGISTER
      // ============================================================
      function login(email, password) {
        var user = getUserByEmail(email);
        if (user && user.password === password) {
          currentUser = user;
          localStorage.setItem('nokj-user', JSON.stringify(user));
          showApp(user);
          loginError.textContent = '';
          return true;
        } else {
          loginError.textContent = 'Invalid email or password. Please try again.';
          return false;
        }
      }

      function register(name, email, password, role) {
        if (getUserByEmail(email)) {
          registerError.textContent = 'Email already registered. Please sign in.';
          return false;
        }
        if (password.length < 6) {
          registerError.textContent = 'Password must be at least 6 characters.';
          return false;
        }
        var newUser = {
          id: generateId(),
          name: name,
          email: email,
          password: password,
          role: role,
          createdAt: new Date().toISOString().split('T')[0],
          status: 'Active'
        };
        if (role === 'Student') {
          students.push(newUser);
        } else if (role === 'Teacher') {
          teachers.push(newUser);
        } else {
          admins.push(newUser);
        }
        saveData();
        registerError.textContent = '';
        showLoginScreen();
        alert('Account created! Please sign in.');
        return true;
      }

        loginScreen.classList.remove('open');
        loginScreen.classList.add('hidden');
        registerScreen.classList.remove('open');
        registerScreen.classList.add('hidden');
        landingPage.classList.add('hidden');
        app.classList.add('logged-in');

        var initials = user.name.split(' ').map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 2);

        userAvatar.className = 'avatar' + (user.role === 'Admin' ? ' admin-avatar' : user.role === 'Teacher' ?
          ' teacher-avatar' : '');
        userDisplayName.textContent = user.name;
        userRole.textContent = user.role;
        sidebarRole.textContent = user.role + ' Portal';

        profileAvatar.className = 'avatar' + (user.role === 'Admin' ? ' admin-avatar' : user.role === 'Teacher' ?
          ' teacher-avatar' : '');
        profileName.textContent = user.name;
        profileRoleText.textContent = user.role + ' · NOKJ Academy';
        profileEmail.textContent = user.email;
        profileId.textContent = 'NOKJ-' + String(user.id).padStart(4, '0');
        profileRole.textContent = user.role;
        profileSince.textContent = user.createdAt || '2026';

        var time = new Date().getHours();
        var greetingText = (time < 12) ? 'Good morning' : (time < 17) ? 'Good afternoon' : 'Good evening';
        greeting.textContent = greetingText + ', ' + user.name + ' 👋';

        if (user.role === 'Admin') {
          adminNavLabel.style.display = 'block';

      function checkSession() {
        var saved = localStorage.getItem('nokj-user');
        if (saved) {
          try {
            var user = JSON.parse(saved);
            if (user && getUserByEmail(user.email)) {
              currentUser = user;

      function renderGradeTable() {
        var courseFilter = document.getElementById('grade-course-filter').value;
        var studentFilter = document.getElementById('grade-student-filter').value;
        var filtered = [];
        enrollments.forEach(function(e) {
          var student = students.find(function(s) { return s.id === e.studentId; });
          var course = courses.find(function(c) { return c.id === e.courseId; });
          if (!student || !course) return;
          var courseMatch = courseFilter === 'all' || e.courseId === parseInt(courseFilter);
          var studentMatch = studentFilter === 'all' || e.studentId === parseInt(studentFilter);
          if (courseMatch && studentMatch) filtered.push({ studentId: e.studentId, studentName: student.name,
            courseId: e.courseId, courseName: course.name });
        });
        filtered.sort(function(a, b) { return a.studentName.localeCompare(b.studentName); });
        var tbody = document.getElementById('grade-table-body');
        tbody.innerHTML = '';
        var totalGrades = 0,
          passingCount = 0,
          failingCount = 0;
        filtered.forEach(function(item) {
          var grade = gradeData[item.studentId + '-' + item.courseId] || null;
          totalGrades++;
          var tr = document.createElement('tr');
          var gradeDisplay = grade !== null ? grade : '-';
          var statusClass = grade !== null ? (grade >= 60 ? 'grade-pass' : 'grade-fail') : '';
          var statusText = grade !== null ? (grade >= 60 ? '✅ Pass' : '❌ Fail') : 'Not graded';
          if (grade !== null) { if (grade >= 60) passingCount++;
            else failingCount++; }
          tr.innerHTML = '<td><strong>' + item.studentName + '</strong></td><td>' + item.courseName +
            '</td><td class="grade-cell"><input type="number" class="grade-input" id="grade-input-' + item.studentId +
            '-' + item.courseId + '" value="' + (grade !== null ? grade : '') +
            '" min="0" max="100" placeholder="-" /><button class="save-grade-btn" data-student="' + item.studentId +
            '" data-course="' + item.courseId + '">Save</button></td><td class="' + statusClass + '">' + statusText +
            '</td><td><button class="action-btn delete" data-student="' + item.studentId + '" data-course="' + item
            .courseId + '" data-type="grade">🗑️</button></td>';
          tbody.appendChild(tr);
        });
        document.getElementById('grade-total').textContent = totalGrades;
        document.getElementById('grade-passing-count').textContent = passingCount;
        document.getElementById('grade-failing-count').textContent = failingCount;
        document.getElementById('grade-count').textContent = filtered.length + ' entries';
        var allGrades = [];
        enrollments.forEach(function(e) {
          var g = gradeData[e.studentId + '-' + e.courseId] || null;
          if (g !== null) allGrades.push(g);
        });
        var avgAll = allGrades.length > 0 ? Math.round(allGrades.reduce(function(a, b) { return a + b; }, 0) / allGrades
          .length) : 0;
        document.getElementById('avg-grade-all').textContent = avgAll + '%';
        var passing = allGrades.filter(function(g) { return g >= 60; }).length;
        var failing = allGrades.filter(function(g) { return g < 60; }).length;
        document.getElementById('passing-students').textContent = passing;
        document.getElementById('failing-students').textContent = failing;
        setLanguage(currentLang);
      }

        if (!currentUser || currentUser.role !== 'Student') return;
        var studentId = currentUser.id;
        var enrolled = getEnrolledCourseIds(studentId);
        var tbody = document.getElementById('student-grade-table-body');

        var gradesList = [];
        enrolled.forEach(function(courseId) {

          if (!course) return;
          var grade = gradeData[studentId + '-' + courseId] || null;
          var tr = document.createElement('tr');
          var gradeDisplay = grade !== null ? grade : '-';
          var statusClass = grade !== null ? (grade >= 60 ? 'grade-pass' : 'grade-fail') : '';
          var statusText = grade !== null ? (grade >= 60 ? '✅ Pass' : '❌ Fail') : 'Not graded';
          if (grade !== null) gradesList.push(grade);
          tr.innerHTML = '<td><strong>' + course.name + '</strong><br><span style="font-size:12px;color:var(--muted);">' +

      function renderMeetings() {
        meetingGrid.innerHTML = '';
        var userMeetings = meetings.filter(function(m) {
          if (!currentUser) return false;
          if (currentUser.role === 'Admin') return true;
          if (currentUser.role === 'Teacher') return m.teacherId === currentUser.id;
          if (currentUser.role === 'Student') return true;
          return false;
        });
        if (userMeetings.length === 0) {
          meetingGrid.innerHTML =
            '<p style="color:var(--muted);text-align:center;padding:40px;">No upcoming classes. Check back later!</p>';
          return;
        }
        userMeetings.forEach(function(meeting) {
          var card = document.createElement('div');
          card.className = 'meeting-card';
          var isTeacher = currentUser && currentUser.role === 'Teacher' && meeting.teacherId === currentUser.id;
          card.innerHTML = '<div class="meeting-header"><h3>' + meeting.title + '</h3><div class="teacher">👨‍🏫 ' +
            getTeacherName(meeting.teacherId) + '</div></div><div class="meeting-body"><div class="time">📅 ' + meeting
            .date + ' • 🕐 ' + meeting.time + ' (' + meeting.duration + ' min)</div>' + (isTeacher ?
            '<div style="font-size:11px;color:var(--muted);margin-top:4px;">📋 You are teaching this class</div>' :
            '') + '<button class="join-btn" data-meeting="' + meeting.id + '">Join Meeting</button></div>';
          meetingGrid.appendChild(card);

          addCard.className = 'meeting-card';
          addCard.style.border = '2px dashed var(--line)';
          addCard.style.display = 'flex';
          addCard.style.alignItems = 'center';
          addCard.style.justifyContent = 'center';
          addCard.style.minHeight = '180px';
          addCard.innerHTML =
            '<div style="text-align:center;padding:20px;"><div style="font-size:40px;margin-bottom:10px;">➕</div><button class="primary-button" id="open-schedule-modal-btn">Schedule New Class</button></div>';
          meetingGrid.appendChild(addCard);
        }
        setLanguage(currentLang);

      function openPresentation(meetingId) {
        var meeting = meetings.find(function(m) { return m.id === meetingId; });
        if (!meeting) return;
        presentationSlides = DEFAULT_PRESENTATION;
        currentSlide = 0;
        document.getElementById('presentation-title').textContent = meeting.title + ' - Presentation';
        document.getElementById('presentation-overlay').classList.add('open');
        updateSlide();
      }

      function updateSlide() {
        var slide = presentationSlides[currentSlide];
        document.getElementById('presentation-slide-title').textContent = slide.title;
        document.getElementById('presentation-slide-text').textContent = slide.content;
        document.getElementById('presentation-slide-counter').textContent = 'Slide ' + (currentSlide + 1) + ' of ' +
          presentationSlides.length;
      }

      function closePresentation() {
        document.getElementById('presentation-overlay').classList.remove('open');
      }

      function nextSlide() {
        if (currentSlide < presentationSlides.length - 1) { currentSlide++;
          updateSlide(); }
      }

      function prevSlide() {
        if (currentSlide > 0) { currentSlide--;
          updateSlide(); }
      }

      function renderCalendar() {
        var firstDay = new Date(currentYear, currentMonth, 1).getDay();
        var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        var today = new Date();
        var todayStr = today.toISOString().split('T')[0];

        calendarMonthLabel.textContent = new Date(currentYear, currentMonth).toLocaleString('default', { month: 'long',
          year: 'numeric' });
        calendarGrid.innerHTML = '';

        var dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        dayLabels.forEach(function(label) {
          var div = document.createElement('div');
          div.className = 'day-label';
          div.textContent = label;
          calendarGrid.appendChild(div);
        });

        for (var i = 0; i < firstDay; i++) {
          var div = document.createElement('div');
          div.className = 'day-cell empty';
          calendarGrid.appendChild(div);
        }

        for (var day = 1; day <= daysInMonth; day++) {
          var dateStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
          var div = document.createElement('div');
          div.className = 'day-cell' + (dateStr === todayStr ? ' today' : '');
          div.dataset.date = dateStr;

          var number = document.createElement('div');
          number.className = 'day-number';
          number.textContent = day;
          div.appendChild(number);

          var dayMeetings = meetings.filter(function(m) { return m.date === dateStr; });
          if (dayMeetings.length > 0) {
            var eventsDiv = document.createElement('div');
            eventsDiv.className = 'day-events';
            dayMeetings.forEach(function(m) {
              var dot = document.createElement('div');
              dot.className = 'event-dot' + (m.teacherId === (currentUser ? currentUser.id : null) ? ' teacher' :
                '');
              dot.textContent = '• ' + m.title + ' (' + m.time + ')';
              eventsDiv.appendChild(dot);
            });
            div.appendChild(eventsDiv);
          }

          div.addEventListener('click', function() {
            var date = this.dataset.date;
            if (currentUser && (currentUser.role === 'Admin' || currentUser.role === 'Teacher')) {
              scheduleDate.value = date;
              openScheduleModal();
            } else {
              var dayMeetings = meetings.filter(function(m) { return m.date === date; });
              alert('Classes on ' + date + ': ' + (dayMeetings.length > 0 ? dayMeetings.map(function(m) { return m
                  .title; }).join(', ') : 'No classes scheduled.'));
            }
          });

          calendarGrid.appendChild(div);
        }

        renderUpcomingClasses();
        setLanguage(currentLang);
      }

      function renderUpcomingClasses() {
        var today = new Date().toISOString().split('T')[0];
        var upcoming = meetings.filter(function(m) { return m.date >= today; }).sort(function(a, b) { return a.date
            .localeCompare(b.date) || a.time.localeCompare(b.time); });

        if (upcoming.length === 0) {
          upcomingClassesList.innerHTML = '<p style="color:var(--muted);">No upcoming classes scheduled.</p>';
          return;
        }

        var html = '';
        upcoming.slice(0, 10).forEach(function(m) {
          var isTeacher = currentUser && currentUser.role === 'Teacher' && m.teacherId === currentUser.id;
          html +=
            '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:white;">' +
            '<div><strong>' + m.title + '</strong><br><span style="font-size:12px;color:var(--muted);">📅 ' + m.date +
            ' at ' + m.time + ' · ' + getTeacherName(m.teacherId) + (isTeacher ? ' (You)' : '') + '</span></div>' +
            '<button class="join-btn" data-meeting="' + m.id +
            '" style="padding:6px 16px;border:0;border-radius:6px;background:var(--primary);color:white;font-weight:600;">Join</button>' +
            '</div>';
        });
        upcomingClassesList.innerHTML = html;

        upcomingClassesList.querySelectorAll('.join-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var meetingId = parseInt(this.dataset.meeting);
            openPresentation(meetingId);
          });
        });
        setLanguage(currentLang);
      }

      function openScheduleModal() {
        if (!currentUser || (currentUser.role !== 'Admin' && currentUser.role !== 'Teacher')) {
          alert('Only Admins and Teachers can schedule classes.');
          return;
        }

        scheduleTeacher.innerHTML = '';
        if (currentUser.role === 'Admin') {
          teachers.forEach(function(t) {
            var opt = document.createElement('option');
            opt.value = t.id;
            opt.textContent = t.name;
            scheduleTeacher.appendChild(opt);
          });
        } else {
          var opt = document.createElement('option');
          opt.value = currentUser.id;
          opt.textContent = currentUser.name;
          scheduleTeacher.appendChild(opt);
        }

        if (scheduleTeacher.options.length === 0) {
          alert('No teachers available. Please create a teacher account first.');
          return;
        }

        if (!scheduleDate.value) {
          var tomorrow = new Date();
          tomorrow.setDate(tomorrow.getDate() + 1);
          scheduleDate.value = tomorrow.toISOString().split('T')[0];
        }
        if (!scheduleTime.value) scheduleTime.value = '09:00';

        scheduleTitle.value = '';
        scheduleLink.value = '';

        scheduleModalOverlay.classList.add('open');
        setLanguage(currentLang);
      }

      function scheduleClass(title, teacherId, date, time, duration, link) {
        meetings.push({
          id: meetings.length + 1,
          title: title,
          teacherId: parseInt(teacherId),
          date: date,
          time: time,
          duration: parseInt(duration),
          link: link || '#'
        });
        saveData();
        renderMeetings();
        renderCalendar();
        renderUpcomingClasses();
        alert('Class scheduled successfully!');
        setLanguage(currentLang);
      }

      //  TASKS
      // ============================================================
      function renderTasks() {
        if (!currentUser) return;
        var isAdmin = currentUser.role === 'Admin';
        var isTeacher = currentUser.role === 'Teacher';
        var adminView = document.getElementById('admin-tasks-view');
        var studentView = document.getElementById('student-tasks-view');

        if (isAdmin || isTeacher) {
          adminView.style.display = 'block';
          studentView.style.display = 'none';
          renderAdminTasks();
        } else {
          adminView.style.display = 'none';
          studentView.style.display = 'block';
          renderStudentTasks();
        }
        setLanguage(currentLang);

      function renderAdminTasks() {
        var search = document.getElementById('task-search').value.toLowerCase();
        var typeFilter = document.getElementById('task-type-filter').value;

        var filtered = tasks.filter(function(t) {
          var matchesSearch = t.title.toLowerCase().includes(search) || t.description.toLowerCase().includes(search);
          var matchesType = typeFilter === 'all' || t.type === typeFilter;
          return matchesSearch && matchesType;
        });

        var container = document.getElementById('admin-task-list');
        container.innerHTML = '';

        if (filtered.length === 0) {
          container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px;">No tasks found.</p>';
          return;
        }

        var totalTasks = tasks.length;
        var pendingCount = 0,
          submittedCount = 0,
          gradedCount = 0;
        tasks.forEach(function(task) {
          var submissions = Object.keys(taskSubmissions).filter(function(key) { return key.startsWith(task.id +
            '-'); });
          var graded = submissions.filter(function(key) {
            return taskSubmissions[key] && taskSubmissions[key].grade !== null && taskSubmissions[key].grade !==
            undefined;
          });
          if (graded.length === submissions.length && submissions.length > 0) { gradedCount++; } else if (submissions
            .length > 0) { submittedCount++; } else { pendingCount++; }
        });
        document.getElementById('task-total').textContent = totalTasks;
        document.getElementById('task-pending').textContent = pendingCount;
        document.getElementById('task-submitted').textContent = submittedCount;
        document.getElementById('task-graded').textContent = gradedCount;

        filtered.forEach(function(task) {
          var submissionKeys = Object.keys(taskSubmissions).filter(function(key) { return key.startsWith(task.id +
            '-'); });
          var totalStudents = students.length;
          var submittedCount = submissionKeys.length;

          var card = document.createElement('div');
          card.className = 'task-card';
          var deadlineClass = task.deadline < new Date().toISOString().split('T')[0] ? 'overdue' : 'on-time';
          var priorityLabel = { high: '🔴 High', medium: '🟡 Medium', low: '🟢 Low' } [task.priority] || 'Medium';
          var priorityClass = task.priority || 'medium';

          var filesHtml = '';
          if (task.files && task.files.length > 0) {
            filesHtml = '<div class="task-files"><strong>📎 Attached Files:</strong>';
            task.files.forEach(function(file) {
              var fileData = file.data || '';
              var escapedData = fileData.replace(/'/g, "\\'");
              filesHtml += '<div class="file-item"><span class="file-icon">📄</span><span class="file-link" onclick="window.openFilePreview(\'' +
                file.name + '\', \'' + escapedData + '\')">' + file.name + '</span></div>';
            });
            filesHtml += '</div>';
          }

          card.innerHTML =
            '<div class="task-header"><div><h3>' + task.title + '</h3><div style="margin-top:4px;font-size:12px;color:var(--muted);">Assigned to: ' +
            (task.assignedTo === 'all' ? 'All Students' : 'Specific') +
            '</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;"><span class="task-priority ' +
            priorityClass + '">' + priorityLabel + '</span><span class="task-type ' + task.type + '">' + task.type
            .charAt(0).toUpperCase() + task.type.slice(1) + '</span></div></div>' +
            '<div class="task-body"><div class="task-description">' + task.description + '</div><div class="task-deadline ' +
            deadlineClass + '">⏰ Due: ' + task.deadline + (deadlineClass === 'overdue' ? ' (Overdue!)' : '') +
            '</div>' + filesHtml +
            '<div style="margin-top:8px;font-size:12px;color:var(--muted);">📊 ' + submittedCount + ' / ' +
            totalStudents + ' students submitted</div></div>' +
            '<div class="task-footer"><button class="secondary-button view-submissions-btn" data-task="' + task.id +
            '">📋 View Submissions (' + submittedCount + ')</button><button class="action-btn delete" data-id="' +
            task.id + '" data-type="task">🗑️ Delete</button></div>';
          container.appendChild(card);
        });
        setLanguage(currentLang);
      }

      function renderStudentTasks() {
        var studentId = currentUser.id;
        var container = document.getElementById('student-task-list');
        var assignedTasks = tasks.filter(function(task) {
          if (task.assignedTo === 'all') return true;
          if (task.assignedTo === 'student') return task.assignedIds && task.assignedIds.includes(studentId);
          if (task.assignedTo === 'course') {
            var studentCourses = getEnrolledCourseIds(studentId);
            return task.assignedIds && task.assignedIds.some(function(cid) { return studentCourses.includes(cid); });
          }
          return false;
        });

        var pendingCount = 0,
          submittedCount = 0,
          gradedCount = 0;
        assignedTasks.forEach(function(task) {
          var key = task.id + '-' + studentId;
          var sub = taskSubmissions[key];
          if (sub && sub.grade !== null && sub.grade !== undefined) gradedCount++;
          else if (sub) submittedCount++;
          else pendingCount++;
        });

        document.getElementById('student-task-total').textContent = assignedTasks.length;
        document.getElementById('student-task-pending').textContent = pendingCount;
        document.getElementById('student-task-submitted').textContent = submittedCount;
        document.getElementById('student-task-graded').textContent = gradedCount;

        container.innerHTML = '';

        if (assignedTasks.length === 0) {
          container.innerHTML =
            '<p style="color:var(--muted);text-align:center;padding:40px;">No tasks assigned to you yet.</p>';
          return;
        }

        assignedTasks.sort(function(a, b) {
          var aOverdue = a.deadline < new Date().toISOString().split('T')[0];
          var bOverdue = b.deadline < new Date().toISOString().split('T')[0];
          if (aOverdue && !bOverdue) return -1;
          if (!aOverdue && bOverdue) return 1;
          return a.deadline.localeCompare(b.deadline);
        });

        assignedTasks.forEach(function(task) {
          var key = task.id + '-' + studentId;
          var submission = taskSubmissions[key];
          var status = submission ? (submission.grade !== null && submission.grade !== undefined ? 'graded' :
            'submitted') : 'pending';
          var deadlineClass = task.deadline < new Date().toISOString().split('T')[0] ? 'overdue' : 'on-time';
          var priorityLabel = { high: '🔴 High', medium: '🟡 Medium', low: '🟢 Low' } [task.priority] || 'Medium';
          var priorityClass = task.priority || 'medium';

          var filesHtml = '';
          if (task.files && task.files.length > 0) {
            filesHtml = '<div class="task-files"><strong>📎 Attached Files:</strong>';
            task.files.forEach(function(file) {
              var fileData = file.data || '';
              var escapedData = fileData.replace(/'/g, "\\'");
              filesHtml += '<div class="file-item"><span class="file-icon">📄</span><span class="file-link" onclick="window.openFilePreview(\'' +
                file.name + '\', \'' + escapedData + '\')">' + file.name + '</span></div>';
            });
            filesHtml += '</div>';
          }

          var card = document.createElement('div');
          card.className = 'task-card';

          var statusDisplay = '';
          var footerHtml = '';

          if (status === 'graded') {
            statusDisplay = '<span class="graded-status">✅ Graded: ' + submission.grade + '%</span>';
            footerHtml = '<div class="graded-status">✅ Graded: ' + submission.grade + '%</div>' + (submission
              .feedback ? '<div style="font-size:12px;color:var(--muted);">📝 ' + submission.feedback + '</div>' :
              '');
          } else if (status === 'submitted') {
            statusDisplay = '<span class="submitted-status">⏳ Submitted</span>';
            footerHtml =
              '<div class="submitted-status">⏳ Submitted</div><div style="font-size:12px;color:var(--muted);">Waiting for grading...</div>';
            if (submission.files && submission.files.length > 0) {
              var fileLinks = '';
              submission.files.forEach(function(file) {
                var fileData = file.data || '';
                var escapedData = fileData.replace(/'/g, "\\'");
                fileLinks += '<span class="item-tag" style="cursor:pointer;color:var(--primary);text-decoration:underline;margin-right:6px;" onclick="window.openFilePreview(\'' +
                  file.name + '\', \'' + escapedData + '\')">📄 ' + file.name + '</span>';
              });
              footerHtml += '<div style="font-size:12px;color:var(--muted);margin-top:4px;">📎 ' + fileLinks +
                '</div>';
            }
          } else {
            statusDisplay = '<span class="pill danger">⚠️ Pending</span>';
            footerHtml =
              '<input type="text" class="answer-input" id="answer-' + task.id + '" placeholder="Enter your answer..." />' +
              '<input type="file" id="file-' + task.id + '" style="display:none;" multiple />' +
              '<button class="file-upload-btn" onclick="document.getElementById(\'file-' + task.id +
              '\').click()">📎 Upload Files</button>' +
              '<span id="file-name-' + task.id + '" class="file-name">No files chosen</span>' +
              '<button class="submit-btn" data-task="' + task.id + '">Submit</button>';
          }

          card.innerHTML =
            '<div class="task-header"><div><h3>' + task.title + '</h3><div style="margin-top:4px;font-size:12px;color:var(--muted);">' +
            task.type.charAt(0).toUpperCase() + task.type.slice(1) +
            '</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;"><span class="task-priority ' +
            priorityClass + '">' + priorityLabel + '</span>' + statusDisplay + '</div></div>' +
            '<div class="task-body"><div class="task-description">' + task.description + '</div><div class="task-deadline ' +
            deadlineClass + '">⏰ Due: ' + task.deadline + (deadlineClass === 'overdue' ? ' ⚠️ Overdue!' : '') +
            '</div>' + filesHtml + '</div>' +
            '<div class="task-footer">' + footerHtml + '</div>';
          container.appendChild(card);

          var fileInput = document.getElementById('file-' + task.id);
          if (fileInput) {
            fileInput.addEventListener('change', function(e) {
              var fileNameSpan = document.getElementById('file-name-' + task.id);
              if (e.target.files && e.target.files.length > 0) {
                var names = Array.from(e.target.files).map(function(f) { return f.name; }).join(', ');
                fileNameSpan.textContent = names;
                var key = task.id + '-' + studentId;
                if (!taskSubmissions[key]) {
                  taskSubmissions[key] = { answer: '', submittedAt: null, grade: null, feedback: null,
                    files: [] };
                }
                var filesData = [];
                var completed = 0;
                Array.from(e.target.files).forEach(function(file, index) {
                  var reader = new FileReader();
                  reader.onload = function(event) {
                    filesData[index] = { name: file.name, size: file.size, type: file.type,
                      data: event.target.result };
                    completed++;
                    if (completed === e.target.files.length) {
                      taskSubmissions[key].files = filesData;
                      saveData();
                    }
                  };
                  reader.readAsDataURL(file);
                });
              } else {
                fileNameSpan.textContent = 'No files chosen';
              }
            });
          }
        });
        setLanguage(currentLang);
      }

      //  TESTS
      // ============================================================
      function renderTests() {
        if (!currentUser) return;
        var isAdmin = currentUser.role === 'Admin';
        var isTeacher = currentUser.role === 'Teacher';
        var adminView = document.getElementById('admin-tests-view');
        var studentView = document.getElementById('student-tests-view');

        if (isAdmin || isTeacher) {
          adminView.style.display = 'block';
          studentView.style.display = 'none';
          renderAdminTests();
        } else {
          adminView.style.display = 'none';
          studentView.style.display = 'block';
          renderStudentTests();
        }
        setLanguage(currentLang);
      }

      function renderAdminTests() {
        var container = document.getElementById('admin-test-list');
        container.innerHTML = '';

        if (tests.length === 0) {
          container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px;">No tests created yet.</p>';
          return;
        }

        tests.forEach(function(test) {
          var card = document.createElement('div');
          card.className = 'task-card';
          var subCount = Object.keys(testSubmissions).filter(function(key) { return key.startsWith(test.id + '-'); })
            .length;

          card.innerHTML =
            '<div class="task-header"><div><h3>' + test.title + '</h3><div style="margin-top:4px;font-size:12px;color:var(--muted);">' +
            getCourseName(test.courseId) + ' · ' + test.questions.length + ' questions</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;"><span class="task-type test">Test</span></div></div>' +
            '<div class="task-body"><div class="task-description">' + test.description + '</div><div class="task-deadline on-time">⏰ Due: ' +

            var testId = parseInt(this.dataset.test);
            viewTestResults(testId);

        container.querySelectorAll('.delete[data-type="test"]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var testId = parseInt(this.dataset.id);
            if (confirm('Delete this test?')) {
              tests = tests.filter(function(t) { return t.id !== testId; });
              Object.keys(testSubmissions).forEach(function(key) {
                if (key.startsWith(testId + '-')) delete testSubmissions[key];
              });

              renderTests();

        var studentId = currentUser.id;
        var container = document.getElementById('student-test-list');
        var enrolledCourses = getEnrolledCourseIds(studentId);

        var assignedTests = tests.filter(function(test) {
          return enrolledCourses.includes(test.courseId);
        });

        if (assignedTests.length === 0) {

          if (status === 'submitted') {

            getCourseName(test.courseId) + ' · ' + test.questions.length + ' questions</div></div><span class="task-type test">Test</span></div>' +
            '<div class="task-body"><div class="task-description">' + test.description + '</div><div class="task-deadline ' +
            deadlineClass + '">⏰ Due: ' + test.deadline + (deadlineClass === 'overdue' ? ' ⚠️ Overdue!' : '') +
            '</div></div>' +
            '<div class="task-footer">' + actionHtml + '</div>';

      function openTakeTestModal(testId) {
        var test = tests.find(function(t) { return t.id === testId; });
        if (!test) return;

        document.getElementById('take-test-title').textContent = test.title;
        document.getElementById('take-test-sub').textContent = test.description + ' · ' + test.questions.length +
          ' questions';

        var container = document.getElementById('take-test-questions');
        container.innerHTML = '';

        test.questions.forEach(function(q, index) {
          var div = document.createElement('div');
          div.className = 'test-question';
          div.innerHTML = '<div class="q-text">' + (index + 1) + '. ' + q.question + '</div><div class="q-options">';
          q.options.forEach(function(option, optIndex) {
            var letter = String.fromCharCode(65 + optIndex);
            div.innerHTML +=
              '<label><input type="radio" name="q-' + index + '" value="' + optIndex + '" /> ' + letter +
              '. ' + option + '</label>';
          });
          div.innerHTML += '</div>';
          container.appendChild(div);
        });

        document.getElementById('take-test-modal-overlay').classList.add('open');
        document.getElementById('take-test-form').dataset.testId = testId;
        setLanguage(currentLang);
      }

      function submitTest(testId) {
        var test = tests.find(function(t) { return t.id === testId; });
        if (!test) return;

        var studentId = currentUser.id;
        var answers = {};
        var allAnswered = true;

        test.questions.forEach(function(q, index) {
          var selected = document.querySelector('input[name="q-' + index + '"]:checked');
          if (selected) {
            answers[index] = parseInt(selected.value);
          } else {
            allAnswered = false;
          }
        });

        if (!allAnswered) {
          alert('Please answer all questions before submitting.');
          return;
        }

        var correct = 0;
        test.questions.forEach(function(q, index) {
          if (answers[index] === q.correctAnswer) correct++;
        });
        var score = Math.round((correct / test.questions.length) * 100);

        var key = testId + '-' + studentId;
        testSubmissions[key] = {
          answers: answers,
          score: score,
          correct: correct,
          total: test.questions.length,
          submittedAt: new Date().toISOString()
        };

        saveData();
        document.getElementById('take-test-modal-overlay').classList.remove('open');
        alert('Test submitted successfully! Your score: ' + score + '%');
        renderTests();
        setLanguage(currentLang);
      }

      function viewStudentTestResults(testId) {
        var studentId = currentUser.id;
        var key = testId + '-' + studentId;
        var submission = testSubmissions[key];
        if (!submission) {
          alert('No submission found.');
          return;
        }

        var test = tests.find(function(t) { return t.id === testId; });
        if (!test) return;

        var msg = '📊 Test Results: ' + test.title + '\n\n';
        msg += 'Score: ' + submission.score + '% (' + submission.correct + '/' + submission.total + ')\n\n';
        msg += 'Question Details:\n';
        test.questions.forEach(function(q, index) {
          var userAnswer = submission.answers[index];
          var isCorrect = userAnswer === q.correctAnswer;
          var letter = String.fromCharCode(65 + (userAnswer !== undefined ? userAnswer : 0));
          msg += (index + 1) + '. ' + (isCorrect ? '✅' : '❌') + ' ' + q.question + '\n';
          msg += '   Your answer: ' + letter + '. ' + (userAnswer !== undefined ? q.options[userAnswer] : 'Not answered') +
            '\n';
          msg += '   Correct: ' + String.fromCharCode(65 + q.correctAnswer) + '. ' + q.options[q.correctAnswer] + '\n\n';
        });

        alert(msg);
        setLanguage(currentLang);
      }

      function viewTestResults(testId) {
        var test = tests.find(function(t) { return t.id === testId; });
        if (!test) return;

        var submissions = Object.keys(testSubmissions).filter(function(key) { return key.startsWith(testId + '-'); });

        if (submissions.length === 0) {
          alert('No submissions for this test yet.');
          return;
        }

        var msg = '📊 Test Results: ' + test.title + '\n\n';
        submissions.forEach(function(key) {
          var studentId = parseInt(key.split('-')[1]);
          var student = students.find(function(s) { return s.id === studentId; });
          var sub = testSubmissions[key];
          if (student) {
            msg += '👤 ' + student.name + ': ' + sub.score + '% (' + sub.correct + '/' + sub.total + ')\n';
          }
        });

        var scores = submissions.map(function(key) { return testSubmissions[key].score; });
        var avg = scores.length > 0 ? Math.round(scores.reduce(function(a, b) { return a + b; }, 0) / scores.length) : 0;
        msg += '\n📊 Average Score: ' + avg + '%';

        alert(msg);
        setLanguage(currentLang);
      }

      function createTest(title, courseId, description, deadline, questions) {
        tests.push({
          id: tests.length + 1,
          title: title,
          courseId: parseInt(courseId),
          description: description,
          deadline: deadline,
          questions: questions,
          createdAt: new Date().toISOString().split('T')[0]
        });
        saveData();
        renderTests();
        alert('Test created successfully!');
        setLanguage(currentLang);
      }

      // ============================================================
      //  FILE PREVIEW
      // ============================================================
      function openFilePreview(fileName, fileData) {
        var body = document.getElementById('file-preview-body');
        body.innerHTML = '';

        if (!fileData || fileData === '' || fileData === 'dummy-pdf-data' || fileData === 'dummy-doc-data') {
          body.innerHTML =
            '<div class="file-preview-fallback">📄 ' + fileName +
            '<br><br>File content not available. This could be because the file was not uploaded with content in demo mode.</div>';
          document.getElementById('file-preview-overlay').classList.add('open');
          return;
        }

        var ext = fileName.split('.').pop().toLowerCase();
        var isImage = ['jpg', 'jpeg', 'png', 'gif', 'svg', 'webp', 'bmp'].includes(ext);
        var isPDF = ext === 'pdf';
        var isText = ['txt', 'md', 'csv', 'json', 'xml', 'html', 'css', 'js', 'log'].includes(ext);

        var content = '';

        if (isImage) {
          content = '<img src="' + fileData + '" class="file-preview-image" alt="' + fileName + '" />';
        } else if (isPDF) {
          content = '<iframe src="' + fileData + '" class="file-preview-iframe" title="' + fileName +
            '"></iframe>';
        } else if (isText) {
          try {
            var base64Data = fileData.split(',')[1] || fileData;
            var decoded = atob(base64Data);
            content = '<pre class="file-preview-text">' + decoded + '</pre>';
          } catch (e) {
            content = '<div class="file-preview-fallback">📄 ' + fileName +
              '<br><br>Text preview not available.<br><a href="' + fileData + '" download="' + fileName +
              '" style="color:var(--primary);">⬇️ Download file</a></div>';
          }
        } else {
          content = '<div class="file-preview-fallback">📄 ' + fileName +
            '<br><br>This file type may not be previewed directly.<br><a href="' + fileData + '" download="' +
            fileName + '" style="color:var(--primary);">⬇️ Download file</a></div>';
        }

        body.innerHTML = content;
        document.getElementById('file-preview-overlay').classList.add('open');
      }

      window.openFilePreview = openFilePreview;

      function closeFilePreview() {
        document.getElementById('file-preview-overlay').classList.remove('open');
        document.getElementById('file-preview-body').innerHTML = '';
      }

      // ============================================================
      //  GRADE TASK MODAL
      // ============================================================
      function openGradeModal(taskId, studentId) {
        gradingTaskId = taskId;
        gradingStudentId = studentId;
        var key = taskId + '-' + studentId;
        var submission = taskSubmissions[key];
        if (!submission) return;

        var task = tasks.find(function(t) { return t.id === taskId; });
        var student = students.find(function(s) { return s.id === studentId; });
        if (!task || !student) return;

        document.getElementById('grade-task-student-name').value = student.name;
        document.getElementById('grade-task-task-title').value = task.title;
        document.getElementById('grade-task-submission-text').value = submission.answer || 'No answer provided.';
        document.getElementById('grade-task-grade').value = submission.grade || '';
        document.getElementById('grade-task-feedback').value = submission.feedback || '';

        var fileContainer = document.getElementById('grade-task-submission-file');
        if (submission.files && submission.files.length > 0) {
          var html = '<strong>📎 Submission Files:</strong><div style="margin-top:4px;">';
          submission.files.forEach(function(file) {
            var fileData = file.data || '';
            var escapedData = fileData.replace(/'/g, "\\'");
            html += '<span class="item-tag" style="display:inline-block;padding:2px 8px;margin:2px;background:#f3f4f6;border-radius:4px;font-size:12px;cursor:pointer;color:var(--primary);text-decoration:underline;" onclick="window.openFilePreview(\'' +
              file.name + '\', \'' + escapedData + '\')">📄 ' + file.name + '</span>';
          });
          html += '</div>';
          fileContainer.innerHTML = html;
        } else {
          fileContainer.innerHTML = '<span style="color:var(--muted);font-size:12px;">No files uploaded.</span>';
        }

        document.getElementById('grade-task-modal-overlay').classList.add('open');
        setLanguage(currentLang);
      }

      function gradeSubmission(taskId, studentId, grade, feedback) {
        var key = taskId + '-' + studentId;
        if (taskSubmissions[key]) {
          taskSubmissions[key].grade = Math.min(100, Math.max(0, Math.round(parseFloat(grade))));
          taskSubmissions[key].feedback = feedback || '';
          saveData();
          renderTasks();
          alert('Grade saved successfully!');
          setLanguage(currentLang);
        }
      }

      function createTask(title, type, description, deadline, priority, assignedTo, assignedIds, files) {
        tasks.push({
          id: tasks.length + 1,
          title: title,
          type: type,
          description: description,
          deadline: deadline,
          priority: priority || 'medium',
          assignedTo: assignedTo || 'all',
          assignedIds: assignedIds || [],
          files: files || [],
          createdAt: new Date().toISOString().split('T')[0]
        });
        saveData();
        renderTasks();
        alert('Task created successfully!');
        setLanguage(currentLang);
      }

      function deleteTask(taskId) {
        tasks = tasks.filter(function(t) { return t.id !== taskId; });
        Object.keys(taskSubmissions).forEach(function(key) {
          if (key.startsWith(taskId + '-')) delete taskSubmissions[key];
        });
        saveData();
        renderTasks();
        setLanguage(currentLang);
      }

      function submitTaskAnswer(taskId, studentId, answer, files) {
        var key = taskId + '-' + studentId;
        if (!taskSubmissions[key]) {
          taskSubmissions[key] = { answer: '', submittedAt: null, grade: null, feedback: null, files: [] };
        }
        taskSubmissions[key].answer = answer;
        taskSubmissions[key].submittedAt = new Date().toISOString();
        if (files && files.length > 0) {
          taskSubmissions[key].files = files;
        }
        saveData();
        renderTasks();
        alert('Task submitted!');
        setLanguage(currentLang);
      }

      function handleModalSubmit(e) {
        e.preventDefault();
        var type = modalType;
        if (type === 'student') {
          var name = document.getElementById('modal-name').value.trim();
          var email = document.getElementById('modal-email').value.trim();
          var password = document.getElementById('modal-password').value.trim();
          var status = document.getElementById('modal-status').value;
          if (!name || !email) { alert('Please fill in all fields'); return; }
          if (modalMode === 'add') {
            if (getUserByEmail(email)) { alert('Email already exists.'); return; }
            students.push({ id: generateId(), name: name, email: email, password: password || 'password123',
              role: 'Student', status: status, createdAt: new Date().toISOString().split('T')[0] });
          } else {
            var index = students.findIndex(function(s) { return s.id === editingId; });
            if (index !== -1) {
              students[index].name = name;
              students[index].email = email;
              if (password) students[index].password = password;
              students[index].status = status;
            }
          }
          saveData();
          renderStudents();
          closeModal();
        } else if (type === 'course') {
          var name = document.getElementById('modal-course-name').value.trim();
          var teacherId = parseInt(document.getElementById('modal-course-teacher').value);
          var description = document.getElementById('modal-course-description').value.trim();
          if (!name || !teacherId) { alert('Please fill in all fields'); return; }
          if (modalMode === 'add') {
            courses.push({ id: courses.length + 1, name: name, teacherId: teacherId, description: description });
          } else {
            var index = courses.findIndex(function(c) { return c.id === editingId; });
            if (index !== -1) { courses[index] = { id: editingId, name: name, teacherId: teacherId,
              description: description }; }
          }
          saveData();
          renderCourses();
          renderStudentCourses();
          closeModal();
        } else {
          var category = document.getElementById('modal-category').value.trim();
          var type = document.getElementById('modal-type').value;
          var amount = parseFloat(document.getElementById('modal-amount').value);
          var date = document.getElementById('modal-date').value;
          var status = document.getElementById('modal-status').value;
          if (!category || isNaN(amount) || !date) { alert('Please fill in all fields'); return; }
          var finalAmount = type === 'Income' ? amount : -amount;
          if (modalMode === 'add') {
            budgetEntries.push({ id: budgetEntries.length + 1, category: category, type: type, amount: finalAmount,
              date: date, status: status });
          } else {
            var index = budgetEntries.findIndex(function(b) { return b.id === editingId; });
            if (index !== -1) { budgetEntries[index] = { id: editingId, category: category, type: type,
                amount: finalAmount, date: date, status: status }; }
          }
          saveData();
          renderBudget();
          closeModal();
        }
        setLanguage(currentLang);
      }

          students = students.filter(function(s) { return s.id !== id; });
          renderStudents();
          renderStudentCourses();
        } else if (type === 'course') {
          enrollments = enrollments.filter(function(e) { return e.courseId !== id; });
          courses = courses.filter(function(c) { return c.id !== id; });
          renderCourses();
          renderStudentCourses();

          budgetEntries = budgetEntries.filter(function(b) { return b.id !== id; });
          renderBudget();
        }

        updateAdminStats();
        setLanguage(currentLang);

        checkboxes.forEach(function(cb) { if (cb.checked) selectedIds.push(parseInt(cb.value)); });
        enrollments = enrollments.filter(function(e) { return e.studentId !== enrollStudentId; });
        selectedIds.forEach(function(courseId) { enrollments.push({ studentId: enrollStudentId, courseId: courseId }); });
        saveData();
