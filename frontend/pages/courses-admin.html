      <section class="page" id="courses-admin">
        <div class="heading"><h1>Course Management</h1><p>Create and manage courses, and enroll students.</p></div>
        <div style="margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="primary-button" id="add-course-btn">+ Add Course</button>
        </div>
        <div class="table-container">
          <div class="table-toolbar">
            <div class="left"><input type="text" id="course-search" placeholder="Search courses..." /></div>
            <div class="right"><span id="course-count" style="font-size:13px;color:var(--muted);">0 courses</span></div>
          </div>
          <table><thead><tr><th>Course Name</th><th>Teacher</th><th>Students</th><th>Actions</th></tr></thead><tbody id="course-table-body"></tbody></table>
          <div class="table-summary"><span>Total Courses: <strong id="course-total">0</strong></span><span>Total Enrollments: <strong id="course-enrollments-total">0</strong></span></div>
        </div>
      </section>
