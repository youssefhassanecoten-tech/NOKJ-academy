      <section class="page" id="students">
        <div class="heading"><h1>Student Records</h1><p>Manage all student information, grades, and attendance.</p></div>
        <div style="margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="primary-button" id="add-student-btn">+ Add Student</button>
          <button class="secondary-button" id="export-students-btn">📥 Export CSV</button>
        </div>
        <div class="table-container">
          <div class="table-toolbar">
            <div class="left"><input type="text" id="student-search" placeholder="Search students..." /><select id="student-filter"><option value="all">All Status</option><option value="Active">Active</option><option value="Warning">Warning</option><option value="Inactive">Inactive</option></select></div>
            <div class="right"><span id="student-count" style="font-size:13px;color:var(--muted);">0 students</span></div>
          </div>
          <table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody id="student-table-body"></tbody></table>
          <div class="table-summary"><span>Total Students: <strong id="student-total">0</strong></span></div>
        </div>
      </section>
