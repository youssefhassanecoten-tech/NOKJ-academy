services:
  postgres:
    image: postgres:16-alpine
    container_name: nokj-postgres
    environment:
      POSTGRES_USER: nokj
      POSTGRES_PASSWORD: nokj
      POSTGRES_DB: nokj_academy
    ports:
      - "5432:5432"
    volumes:
      - nokj_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/dev.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nokj -d nokj_academy"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: nokj-api
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: nokj
      PGPASSWORD: nokj
      PGDATABASE: nokj_academy
      JWT_SECRET: change-me-in-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: nokj-web
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  nokj_pgdata: